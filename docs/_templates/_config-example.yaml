title: ... Project
description: A system for ...
author: A Student

development: false
picotheme: azure

# Applies the default layout to every page, since pages have no front matter of their own
defaults:
  - scope:
      path: ""
    values:
      layout: default

# jekyll-optional-front-matter lets pages build without needing front matter (as GitHub's built-in Pages build does)
# jekyll-relative-links rewrites in-page links to .md files to their built .html equivalent
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
