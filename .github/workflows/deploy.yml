name: Deploy Main Site and Docs

on:
  push:
    branches:
      - main # Change this to 'master' if your default branch uses that name

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # Docs are Jekyll source (Markdown/Liquid) and must be built into static HTML,
      # otherwise GitHub Pages just serves the raw, unrendered files
      - name: Build Docs with Jekyll
        run: |
          gem install jekyll jekyll-optional-front-matter jekyll-relative-links
          jekyll build --source docs --destination dist/docs --baseurl "/${{ github.event.repository.name }}/docs"

      # This step creates a clean staging folder and merges your two directories
      - name: Merge Site and Docs
        run: |
          mkdir -p dist
          cp -r site/* dist/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
